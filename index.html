    <!-- set before the page paints: the theme picked with the day/night switch, or else the system
         setting (followed live until a choice is saved) -->
    <script>
      (() => {
        const system = matchMedia("(prefers-color-scheme: dark)");
        const saved = () => {
          try {
            const theme = localStorage.getItem("theme");
            return theme === "light" || theme === "dark" ? theme : null;
          } catch {
            return null;
          }
        };
        const apply = () =>
          (document.documentElement.dataset.theme = saved() || (system.matches ? "dark" : "light"));
        apply();
        system.addEventListener("change", apply);
      })();
    </script>
